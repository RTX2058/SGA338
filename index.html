<html lang="id">
<head>

<title>QRIS SGA338</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --top:#103247; --bot:#0e2c40; --field:#001c2e; --line:#7f8f9a; --ok:#22c55e; --err:#ef4444; --split:56px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{background:var(--bot)}
body{margin:0;min-height:100vh;color:#fff;font-family:'Roboto','Segoe UI',Arial,sans-serif;
  background:linear-gradient(to bottom,var(--top) 0,var(--top) var(--split),var(--bot) var(--split));
  overflow-x:hidden}

/* header 892x128 persis seperti referensi */
.hwrap{position:relative;margin:0 auto;width:892px;height:128px}
.stage{position:absolute;left:0;top:0;width:892px;height:128px;transform-origin:0 0}
.ab{position:absolute;display:block;pointer-events:none;user-select:none}
.txt{position:absolute;font-weight:700;font-size:11px;line-height:1;white-space:nowrap;color:#fff}
.nl{position:absolute;top:100px;width:80px;text-align:center;font-weight:700;font-size:11px;line-height:14px;color:#fff;white-space:nowrap}

.fld{position:absolute;top:13px;width:104px;height:31px;border:1px solid var(--line);border-radius:3px;background:var(--field)}
#fIn{left:326px} #fOut{left:454px}
.fld textarea{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0 10px;border:0;border-radius:3px;background:transparent;color:#fff;
  font:14px/29px 'Roboto',sans-serif;resize:none;outline:none;overflow:hidden;white-space:pre}
#fOut textarea{padding-right:28px}
.fld textarea::placeholder{color:#6a7b88;opacity:1}
.fld textarea:focus{position:absolute;left:0;top:0;z-index:30}
.fld:focus-within{border-color:#a9bac5}
/* panel lebar saat fokus */
.fld textarea:focus{top:39px;height:250px;width:500px;padding:10px 12px;background:var(--field);border:1px solid var(--line);border-radius:3px;
  font:13px/1.55 'JetBrains Mono',Consolas,monospace;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.55)}
#fIn textarea:focus{left:0}
#fOut textarea:focus{left:-128px}
.fld.bad{border-color:var(--err)}
.fld.good{border-color:var(--ok)}
.masked{-webkit-text-security:disc;text-security:disc}

.eye{position:absolute;left:539px;top:18px;width:20px;height:19px;border:0;background:transparent;cursor:pointer;padding:0;z-index:5}

.pill{position:absolute;top:13px;height:31px;border-radius:99px;color:#fff;font:700 13.5px/29px 'Roboto',sans-serif;text-align:center;cursor:pointer;padding:0}
.pill:focus-visible{outline:2px solid #8fb4c7;outline-offset:2px}
.pill:disabled{opacity:.45;cursor:not-allowed}
#processBtn{left:582px;width:104px;border:1px solid #4a6679;background:linear-gradient(180deg,#3b596d 0,#123449 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
#clearBtn{left:710px;width:116px;border:1px solid #9a9a9a;background:linear-gradient(180deg,#1b2b35 0,#010304 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pill:hover:not(:disabled){filter:brightness(1.2)}

.dec{position:absolute;border:0;background:transparent;padding:0}

/* baris salin (muncul setelah extract) */
.copyrow{display:none;justify-content:center;margin:26px auto 0;width:892px}
.copyrow.show{display:flex}
#copyBtn{position:static;width:150px;height:31px;border:1px solid #4a6679;background:linear-gradient(180deg,#3b596d 0,#123449 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
#copyBtn.done{background:linear-gradient(180deg,#14452f,#0a2a1c);color:var(--ok);border-color:var(--ok)}
</style>
</head>

<div class="copyrow" id="copyRow"><button id="copyBtn" class="pill" type="button">COPY HASIL</button></div>

<script>
"use strict";
function $(id){return document.getElementById(id);}

var inputText=$("inputText"), outputText=$("outputText"), processBtn=$("processBtn"),
    copyBtn=$("copyBtn"), clearBtn=$("clearBtn");
var boxIn=$("fIn"), boxOut=$("fOut"), copyRow=$("copyRow"), eyeBtn=$("eyeBtn");
var copyTimer=null;
/* Jumlah kolom kosong antara USERNAME dan TOTAL (ubah angka ini untuk geser kolom angka) */
var EMPTY_COLS=6;

/* skala header supaya muat di layar */
function fit(){
  var s=Math.min(1,window.innerWidth/892);
  var st=$("stage"), hw=$("hwrap");
  st.style.transform="scale("+s+")";
  hw.style.width=(892*s)+"px"; hw.style.height=(128*s)+"px";
  copyRow.style.width=(892*s)+"px";
  document.documentElement.style.setProperty("--split",(56*s)+"px");
}
window.addEventListener("resize",fit); fit();

function setStatus(msg,type){
  boxIn.classList.toggle("bad",type==="error"||type==="warn");
  boxOut.classList.toggle("good",type==="ok");
}
function resetCopyBtn(){
  clearTimeout(copyTimer);
  copyBtn.classList.remove("done");
  copyBtn.textContent="COPY HASIL";
}
function updateInputMeta(){ boxIn.classList.remove("bad"); }
function updateOutputMeta(){}

eyeBtn.addEventListener("click",function(){ outputText.classList.toggle("masked"); });

/* ===== EXTRACT (logika asli tidak berubah) ===== */
function runExtract(){
  var raw=inputText.value;
  if(!raw.trim()){setStatus("Input masih kosong \u2014 paste data dulu.","error");return;}

  resetCopyBtn();

  var text=raw.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var blocks=splitTransactions(text);
  var results=[];
  blocks.forEach(function(block){
    var result=extractTransaction(block);
    if(result) results.push(result);
  });

  /* Balik urutan: A B C D -> D C B A */
  results.reverse();

  if(results.length===0){
    outputText.value="";
    copyBtn.disabled=true;
    copyRow.classList.remove("show");
    updateOutputMeta(null);
    setStatus("0 data berhasil di-extract. Cek format data Anda.","warn");
    return;
  }

  /* Kolom USERNAME, lalu EMPTY_COLS kolom kosong, lalu TOTAL */
  outputText.value=results.map(function(item){
    return [item.username].concat(new Array(EMPTY_COLS).fill(""),[item.total]).join("\t");
  }).join("\n");

  copyBtn.disabled=false;
  copyRow.classList.add("show");
  copyBtn.textContent="COPY HASIL ("+results.length+")";
  updateOutputMeta(results);
  setStatus("\u2713 "+results.length+" data berhasil di-extract \u2014 klik COPY.","ok");
}

processBtn.addEventListener("click",runExtract);
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runExtract();}
});

/* ===== SPLIT TRANSAKSI (logika asli) ===== */
function splitTransactions(text){
  var lines=text.split("\n"), blocks=[], current=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(/^\d+$/.test(line)){
      var next=getNextNonEmptyLine(lines,i+1);
      if(next&&/^\d{8,}$/.test(next)){
        if(current) blocks.push(current);
        current=[line];
        continue;
      }
    }
    if(current) current.push(line);
  }
  if(current) blocks.push(current);
  return blocks;
}

/* ===== EXTRACT TRANSAKSI (logika asli) ===== */
function extractTransaction(lines){
  var clean=lines.map(function(x){return x.trim();}).filter(function(x){return x!=="";});
  var username="", total="";

  for(var i=0;i<clean.length;i++){
    if(/^P\s*:/i.test(clean[i])){username=clean[i+1]||"";break;}
  }
  for(var j=0;j<clean.length;j++){
    var match=clean[j].match(/^Rp\s*([0-9.,]+)/i);
    if(match){total=formatMoney(match[1]);break;}
  }

  if(!username||!total) return null;
  if(/^(username|user id)$/i.test(username)) return null;
  return {username:username,total:total};
}

/* ===== FORMAT MONEY (logika asli) ===== */
function formatMoney(value){
  if(!value) return "";
  value=value.replace(/[^0-9.,]/g,"");
  if(value.includes(".")) value=value.replace(/\./g,"");
  if(value.includes(",")){
    var parts=value.split(",");
    if(parts.length>1&&parts[parts.length-1].length===3) value=parts.join("");
    else value=value.replace(",",".");
  }
  var number=parseFloat(value);
  if(isNaN(number)) return "";
  return number.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getNextNonEmptyLine(lines,start){
  for(var i=start;i<lines.length;i++){
    if(lines[i].trim()!=="") return lines[i].trim();
  }
  return null;
}

/* ===== COPY ===== */
copyBtn.addEventListener("click",async function(){
  var text=outputText.value;
  if(!text) return;
  var ok=true;
  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    outputText.focus(); outputText.select();
    try{ok=document.execCommand("copy");}catch(_){ok=false;}
  }
  if(!ok){setStatus("Gagal menyalin \u2014 pilih teks hasil secara manual.","error");return;}
  copyBtn.classList.add("done");
  copyBtn.textContent="TERSALIN \u2713";
  setStatus("Tersalin! Tinggal tempel ke Excel / Google Sheets.","ok");
  clearTimeout(copyTimer);
  copyTimer=setTimeout(function(){resetCopyBtn();copyBtn.textContent="COPY HASIL ("+(outputText.value?outputText.value.split("\n").length:0)+")";},2000);
});

/* ===== CLEAR ===== */
clearBtn.addEventListener("click",function(){
  inputText.value=""; outputText.value="";
  copyBtn.disabled=true;
  copyRow.classList.remove("show");
  resetCopyBtn();
  updateInputMeta(); updateOutputMeta(null);
  setStatus("");
  inputText.focus();
});

/* ===== AUTO PASTE (logika asli) ===== */
document.addEventListener("paste",function(event){
  var active=document.activeElement;
  if(active===inputText||active===outputText) return;
  var text=event.clipboardData.getData("text/plain");
  if(text){
    inputText.value=text;
    event.preventDefault();
    updateInputMeta();
    setStatus("Data ditempel otomatis \u2014 siap di-extract.","info");
    if(matchMedia("(pointer: fine)").matches) inputText.focus();
  }
});

[inputText,outputText].forEach(function(t){t.addEventListener("focus",function(){t.scrollLeft=0;t.scrollTop=0;});});
inputText.addEventListener("input",updateInputMeta);
updateInputMeta();
</script>
</body>
</html>
